name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run cap:sync
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PsideloadVersionCode="$(git rev-list --count HEAD)"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChampManager
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Commit sideload APK
        if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Refresh the sideload APK') }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main has moved on; skip APK commit from this stale run"
            exit 0
          fi
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/ChampManager.apk
          VERSION_CODE="$(git rev-list --count HEAD)"
          printf '{\n  "versionCode": %s,\n  "versionName": "1.0.%s",\n  "apkUrl": "https://github.com/RoryOL/ChampManager/raw/main/releases/ChampManager.apk"\n}\n' "$VERSION_CODE" "$VERSION_CODE" > releases/version.json
          git add releases/ChampManager.apk releases/version.json
          if git diff --cached --quiet; then
            echo "Sideload APK already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the sideload APK"
          git pull --rebase origin main
          git push
