name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run cap:sync
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChampManager
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Commit sideload APK
        if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Refresh the sideload APK') }}
        run: |
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/ChampManager.apk
          git add releases/ChampManager.apk
          if git diff --cached --quiet; then
            echo "Sideload APK already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the sideload APK"
          git push
